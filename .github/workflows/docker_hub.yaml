name: PublishImage

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'Dockerfile'

jobs:
  publish_images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Login to Docker
        uses: docker/login-action@v1
        with:
          username: ${{secrets.DOCKER_HUB_USERNAME}}
          password: ${{secrets.DOCKER_HUB_ACCESS_TOKEN}}
      
      - name: BuildImage
        run: docker build . -t ${{secrets.DOCKER_HUB_USERNAME}}/salarymodel:latest

      - name: PushToHub
        run: docker push ${{secrets.DOCKER_HUB_USERNAME}}/salarymodel:latest 