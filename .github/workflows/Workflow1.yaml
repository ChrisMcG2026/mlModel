name: mlModelexample

on:
  workflow_dispatch:

jobs:
    echo:
        runs-on: self-hosted
        steps:
          - name: Checkout Code
            uses: actions/checkout@v6
            
          - name: Set up Python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'
                
                
                
          - name: Install Dependencies
            run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest

          - name: Run Unit Tests
            run: pytest -v

          - name: Docker Build
            run: docker build -t first_run .
    
         
      
