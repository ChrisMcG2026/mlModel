name: mlModelexample

on:
  workflow_dispatch:

jobs:
    echo:
        runs-on: self-hosted
        steps:
          - name: Checkout Code
            uses: actions/checkout@v6
            
          - name: Create Virtual Environment & Install Dependencies
            run: |
                python3 -m venv .venv
                source .venv/bin/activate
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest
                
          - name: Run Unit Tests
            run: |
                source .venv/bin/activate
                pytest -v

          - name: Docker Build
            run: docker build -t first_run .
         # - name: Docker Run
         #   run: docker run first_run
    
         
      
